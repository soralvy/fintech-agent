# Offline verification gate: the same scripts/verify.py a developer runs.
# No provider key, repository secret, or live OpenAI / Alpha Vantage call.
# Third-party actions are pinned to full commit SHAs; the tag is in the comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # The pgvector version docs/TECH_BASELINE.md pins, on PostgreSQL 18.
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          # The job-local, throwaway database accepts connections without a
          # password, so the workflow holds no credential.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fintech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only the disposable *_test database; DATABASE_URL stays unset.
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/fintech_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Apply the migration to the test database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_initial.sql

      - name: Run the offline verification gate (fails on any skipped test)
        run: >-
          env
          -u DATABASE_URL
          -u OPENAI_API_KEY -u OPENAI_BASE_URL -u OPENAI_ORG_ID -u OPENAI_PROJECT_ID
          -u OPENAI_EMBEDDING_MODEL -u OPENAI_EMBEDDING_DIMENSIONS -u OPENAI_LLM_MODEL
          -u ALPHA_VANTAGE_API_KEY -u MCP_TOOL_TIMEOUT_SECONDS
          -u JEV_API_KEY -u JEV_MODEL
          -u LANGSMITH_API_KEY -u LANGSMITH_TRACING -u LANGSMITH_TRACING_V2
          -u LANGCHAIN_API_KEY -u LANGCHAIN_TRACING -u LANGCHAIN_TRACING_V2 -u LANGCHAIN_HANDLER
          uv run --locked python scripts/verify.py
