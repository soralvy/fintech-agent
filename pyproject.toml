[project]
name = "fintech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.141.1",
    "httpx==0.28.1",
    "langgraph==1.2.11",
    "mcp==2.2.0",
    "openai==3.14.1",
    "pgvector==0.5.0",
    "psycopg[binary,pool]==3.3.5",
    "pypdf==6.19.0",
    "tiktoken==0.14.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Added to Ruff's defaults, at Ruff's default thresholds (docs/TECH_BASELINE.md
# section 3.16).
extend-select = ["ASYNC", "B", "C901", "PLR0911", "PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
