[project]
name = "fintech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.141.1",
    "langgraph==1.2.11",
    "mcp==2.2.0",
    "openai==3.14.1",
    "pgvector==0.5.0",
    "psycopg[binary,pool]==3.3.5",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
